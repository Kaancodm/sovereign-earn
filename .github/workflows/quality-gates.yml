name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package metadata
        run: node -e "const p=require('./package.json'); if(!p.name) process.exit(1)"
      - name: Run repository checks
        run: npm run check
