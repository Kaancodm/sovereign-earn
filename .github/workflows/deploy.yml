name: Firebase Staging-Deploy

# Sicherheitsprinzip: nur manueller Staging-Deploy, niemals bei push/PR.
on:
  workflow_dispatch:
    inputs:
      firebase_project_id:
        description: "Firebase-Projekt-ID für dieses Staging-Deployment"
        required: true
        default: "sovereign-bdb76"

jobs:
  check:
    name: Syntax & Staging-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: CI Checks
        run: |
          npm test
          npm run check:staging

  deploy:
    name: Deploy zu Staging
    runs-on: ubuntu-latest
    needs: check
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Firebase CLI installieren
        run: npm install -g firebase-tools@latest
      - name: Functions-Dependencies installieren
        working-directory: functions
        run: npm install
      - name: Firebase Authentifizierung vorbereiten
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          SA="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$SA"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA" >> "$GITHUB_ENV"
      - name: Firebase/IAM Preflight
        env:
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        run: |
          set -euo pipefail
          echo "Prüfe Zugriff auf Cloud Functions für $FIREBASE_PROJECT_ID ..."
          if ! firebase functions:list --project "$FIREBASE_PROJECT_ID" --non-interactive >/tmp/firebase-functions-list.log 2>&1; then
            cat /tmp/firebase-functions-list.log
            echo ""
            echo "STAGING BLOCKER: Der GitHub-Service-Account kann die Cloud-Functions des Projekts nicht auflisten."
            echo "Benötigt: Cloud Functions Admin/Developer plus Service Account User für die Runtime-/Build-Service-Accounts."
            exit 1
          fi
      - name: Cloud Functions deployen
        env:
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        run: |
          set -euo pipefail
          firebase deploy --project "$FIREBASE_PROJECT_ID" --non-interactive --force \
            --only functions:acceptCoachingRequest,functions:completeCoachingRequest,functions:declineCoachingRequest,functions:cancelCoachingRequest,functions:createCoachingRequest,functions:askBuildAdvisor,functions:updateSenseiProfile,functions:ensureUserProfile,functions:requestAccountDeletion,functions:healthCheck,functions:pollfishPostbackV2,functions:bitlabsPostbackV2
      - name: Firestore Rules deployen
        env:
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        run: |
          set -euo pipefail
          firebase deploy --project "$FIREBASE_PROJECT_ID" --non-interactive --force --only firestore:rules
      - name: Hosting deployen
        env:
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        run: |
          set -euo pipefail
          firebase deploy --project "$FIREBASE_PROJECT_ID" --non-interactive --force --only hosting
