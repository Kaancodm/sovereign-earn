name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      firebase_project:
        description: Firebase project id used for staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts

      - name: Validate source
        run: |
          npm test
          npm run check

      - name: Authenticate Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Functions, Rules and Hosting
        env:
          FIREBASE_PROJECT: ${{ inputs.firebase_project }}
        run: |
          firebase deploy \
            --project "$FIREBASE_PROJECT" \
            --only functions,firestore:rules,firestore:indexes,hosting \
            --non-interactive
