# Sovereign Earn v2 – GitHub Actions Workflow for automated Firebase Deploy
#
# Setup:
#   1. Download Firebase Service Account Key:
#      https://console.firebase.google.com/project/sovereign-bdb76/settings/serviceaccounts/adminsdk
#   2. Add as GitHub Secret:
#      Settings → Secrets and variables → Actions → New repository secret
#      Name: FIREBASE_SERVICE_ACCOUNT_SOVEREIGN_BDB76
#      Value: (paste entire JSON content)
#   3. On every push to main, this workflow will automatically deploy

name: Deploy to Firebase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOVEREIGN_BDB76 }}'
          channelId: live
          projectId: sovereign-bdb76
          entryPoint: functions

      - name: Deploy Functions
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOVEREIGN_BDB76 }}
        run: |
          firebase use sovereign-bdb76
          firebase deploy --only functions:askBuildAdvisor,functions:createCoachingRequest,functions:acceptCoachingRequest,functions:completeCoachingRequest,functions:rejectCoachingRequest,functions:cancelCoachingRequest,functions:timeoutCoachingRequests,functions:updateSenseiProfile

      - name: Deploy Firestore Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOVEREIGN_BDB76 }}
        run: |
          firebase deploy --only firestore:rules

      - name: Deploy Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOVEREIGN_BDB76 }}
        run: |
          firebase deploy --only hosting

      - name: Notify Success
        if: success()
        run: |
          echo "Deploy erfolgreich!"

      - name: Notify Failure
        if: failure()
        run: |
          echo "Deploy fehlgeschlagen. Bitte GitHub Actions Logs pruefen."
