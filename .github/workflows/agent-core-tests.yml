name: Sovereign Agent Core Tests

on:
  push:
    branches:
      - sovereign-v1-harness-analysis
      - agent-core-trust-boundary-hardening
  pull_request:
    branches:
      - sovereign-v1-harness-analysis
      - agent-core-trust-boundary-hardening

jobs:
  agent-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies when lockfile exists
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json present; skipping npm ci."
          fi
      - name: Run exact Agent Core test command
        run: npm run test:agent-core
