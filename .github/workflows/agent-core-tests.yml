name: Sovereign Agent Core Tests

on:
  push:
    branches:
      - agent-core-trust-boundary-hardening
      - release-handover/agent-core-mvp
  pull_request:
    branches:
      - main
      - agent-core-trust-boundary-hardening
      - release-handover/agent-core-mvp

jobs:
  agent-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run exact Agent Core test command
        run: npm run test:agent-core
