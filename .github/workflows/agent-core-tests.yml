name: Sovereign Agent Core and Skills v1 Tests

on:
  push:
    branches:
      - agent-core-trust-boundary-hardening
      - skills-v1-foundation
  pull_request:
    branches:
      - agent-core-trust-boundary-hardening
      - skills-v1-foundation

jobs:
  agent-core-and-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run Agent Core, Skills v1, and Harness P0 tests
        run: npm run test:agent-core
